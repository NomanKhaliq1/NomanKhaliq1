<svg
  width="1440"
  height="820"
  viewBox="0 0 1440 820"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Noman Ghauri — Web Developer</title>
  <desc id="desc">Animated editorial portfolio hero for Noman Ghauri.</desc>

  <defs>
    <!-- =========================
         GRADIENTS
    ========================== -->

    <linearGradient id="background" x1="0" y1="0" x2="1440" y2="820">
      <stop offset="0%" stop-color="#090D12"/>
      <stop offset="55%" stop-color="#0C121A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#68B5FF"/>
      <stop offset="100%" stop-color="#4778FF"/>
    </linearGradient>

    <linearGradient id="accentWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3E5C8"/>
      <stop offset="100%" stop-color="#B8A17E"/>
    </linearGradient>

    <radialGradient id="orb" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1190 190) rotate(125) scale(420 420)">
      <stop offset="0%" stop-color="#4E79FF" stop-opacity=".22"/>
      <stop offset="55%" stop-color="#4E79FF" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#4E79FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="28"/>
    </filter>

    <clipPath id="heroClip">
      <rect width="1440" height="820"/>
    </clipPath>

    <!-- =========================
         STYLES
    ========================== -->

    <style>
      .sans {
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Arial,
          sans-serif;
      }

      .mono {
        font-family:
          "SFMono-Regular",
          Consolas,
          "Liberation Mono",
          monospace;
      }

      /* ---------- SLIDES ---------- */

      .slide {
        opacity: 0;
        transform: translateY(22px);
      }

      .slide-1 {
        animation: slideOne 15s ease-in-out infinite;
      }

      .slide-2 {
        animation: slideTwo 15s ease-in-out infinite;
      }

      .slide-3 {
        animation: slideThree 15s ease-in-out infinite;
      }

      @keyframes slideOne {
        0%, 28% {
          opacity: 1;
          transform: translateY(0);
        }

        33%, 95% {
          opacity: 0;
          transform: translateY(-18px);
        }

        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideTwo {
        0%, 30% {
          opacity: 0;
          transform: translateY(22px);
        }

        35%, 61% {
          opacity: 1;
          transform: translateY(0);
        }

        66%, 100% {
          opacity: 0;
          transform: translateY(-18px);
        }
      }

      @keyframes slideThree {
        0%, 63% {
          opacity: 0;
          transform: translateY(22px);
        }

        68%, 94% {
          opacity: 1;
          transform: translateY(0);
        }

        100% {
          opacity: 0;
          transform: translateY(-18px);
        }
      }

      /* ---------- PAGE INDICATORS ---------- */

      .indicator-1 {
        animation: indicatorOne 15s infinite;
      }

      .indicator-2 {
        animation: indicatorTwo 15s infinite;
      }

      .indicator-3 {
        animation: indicatorThree 15s infinite;
      }

      @keyframes indicatorOne {
        0%, 28% {
          width: 92px;
          opacity: 1;
        }

        33%, 100% {
          width: 28px;
          opacity: .25;
        }
      }

      @keyframes indicatorTwo {
        0%, 32% {
          width: 28px;
          opacity: .25;
        }

        35%, 61% {
          width: 92px;
          opacity: 1;
        }

        66%, 100% {
          width: 28px;
          opacity: .25;
        }
      }

      @keyframes indicatorThree {
        0%, 66% {
          width: 28px;
          opacity: .25;
        }

        68%, 94% {
          width: 92px;
          opacity: 1;
        }

        100% {
          width: 28px;
          opacity: .25;
        }
      }

      /* ---------- BACKGROUND MOTION ---------- */

      .float-a {
        animation: floatA 9s ease-in-out infinite;
      }

      .float-b {
        animation: floatB 11s ease-in-out infinite;
      }

      .float-c {
        animation: floatC 8s ease-in-out infinite;
      }

      @keyframes floatA {
        0%, 100% {
          transform: translate(0px, 0px);
        }

        50% {
          transform: translate(-18px, 16px);
        }
      }

      @keyframes floatB {
        0%, 100% {
          transform: translate(0px, 0px);
        }

        50% {
          transform: translate(22px, -12px);
        }
      }

      @keyframes floatC {
        0%, 100% {
          transform: translateY(0px);
        }

        50% {
          transform: translateY(-12px);
        }
      }

      .blink {
        animation: blink 1.5s ease-in-out infinite;
      }

      @keyframes blink {
        0%, 100% {
          opacity: 1;
        }

        50% {
          opacity: .25;
        }
      }

      .ticker {
        animation: ticker 18s linear infinite;
      }

      @keyframes ticker {
        from {
          transform: translateX(0px);
        }

        to {
          transform: translateX(-520px);
        }
      }
    </style>
  </defs>

