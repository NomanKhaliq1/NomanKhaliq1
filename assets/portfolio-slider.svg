<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgMain" x1="80" y1="40" x2="1120" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="blueGlow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.28"/>
    </filter>

    <style>
      .sans { font-family: Inter, Arial, Helvetica, sans-serif; }
      .mono { font-family: "IBM Plex Mono", "Courier New", monospace; }

      .slide {
        opacity: 0;
        transform: translateY(10px);
      }

      .s1 { animation: s1 12s infinite; }
      .s2 { animation: s2 12s infinite; }
      .s3 { animation: s3 12s infinite; }

      @keyframes s1 {
        0%, 28%   { opacity: 1; transform: translateY(0); }
        33%, 100% { opacity: 0; transform: translateY(10px); }
      }

      @keyframes s2 {
        0%, 32%   { opacity: 0; transform: translateY(10px); }
        37%, 61%  { opacity: 1; transform: translateY(0); }
        66%, 100% { opacity: 0; transform: translateY(10px); }
      }

      @keyframes s3 {
        0%, 65%   { opacity: 0; transform: translateY(10px); }
        70%, 95%  { opacity: 1; transform: translateY(0); }
        100%      { opacity: 0; transform: translateY(10px); }
      }

      .bar1 { animation: bar1 12s infinite; }
      .bar2 { animation: bar2 12s infinite; }
      .bar3 { animation: bar3 12s infinite; }

      @keyframes bar1 {
        0%, 28%   { width: 70px; opacity: 1; }
        33%, 100% { width: 18px; opacity: .35; }
      }

      @keyframes bar2 {
        0%, 32%   { width: 18px; opacity: .35; }
        37%, 61%  { width: 70px; opacity: 1; }
        66%, 100% { width: 18px; opacity: .35; }
      }

      @keyframes bar3 {
        0%, 65%   { width: 18px; opacity: .35; }
        70%, 95%  { width: 70px; opacity: 1; }
        100%      { width: 18px; opacity: .35; }
      }

      .blink { animation: blink 1.2s infinite; }
      @keyframes blink {
        0%,100% { opacity: 1; }
        50% { opacity: .25; }
      }

      .floatA { animation: floatA 7s ease-in-out infinite; }
      .floatB { animation: floatB 8s ease-in-out infinite; }

      @keyframes floatA {
        0%,100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }

      @keyframes floatB {
        0%,100% { transform: translateY(0px); }
        50% { transform: translateY(9px); }
      }
    </style>
  </defs>

  <!-- Outer shell -->
  <rect width="1200" height="430" rx="18" fill="#0B0F14"/>
  <rect x="1" y="1" width="1198" height="428" rx="17" stroke="#2B3139"/>

  <!-- Main editorial card -->
  <rect x="34" y="56" width="1132" height="318" rx="22" fill="url(#bgMain)" stroke="#2A313C" filter="url(#shadow)"/>

  <!-- Left dark strip -->
  <rect x="34" y="56" width="96" height="318" rx="22" fill="#0A0E14"/>

  <!-- soft accents -->
  <rect x="1044" y="92" width="78" height="12" fill="#F3F4F6" opacity=".07" class="floatA"/>
  <rect x="986" y="116" width="136" height="8" fill="url(#purpleGlow)" opacity=".22" class="floatB"/>
  <rect x="955" y="315" width="165" height="12" fill="url(#blueGlow)" opacity=".12" class="floatA"/>
  <rect x="168" y="118" width="10" height="198" fill="#0F172A" opacity=".45"/>

  <!-- top labels -->
  <text x="82" y="106" class="mono" font-size="12" fill="#A1A1AA" letter-spacing="2.4">PROFILE / 2026</text>
  <text x="1080" y="106" class="mono" font-size="12" fill="#A1A1AA" letter-spacing="2" text-anchor="end">KARACHI · PK</text>

  <!-- left identity -->
  <text x="82" y="154" class="sans" font-size="60" font-weight="800" fill="#F9FAFB" letter-spacing="-3">NOMAN</text>
  <text x="82" y="192" class="sans" font-size="22" font-weight="500" fill="#C4CBD4" letter-spacing="5">GHOURI</text>

  <text x="82" y="264" class="mono" font-size="12" fill="#E5E7EB" letter-spacing="2">WEB DEVELOPER</text>
  <circle cx="84" cy="287" r="4" fill="#22C55E" class="blink"/>
  <text x="97" y="291" class="mono" font-size="11" fill="#9CA3AF" letter-spacing="1.4">AVAILABLE / ONLINE</text>

  <rect x="80" y="320" width="180" height="30" rx="8" fill="#111827" stroke="#2C3440"/>
  <text x="96" y="339" class="mono" font-size="10.8" fill="#D1D5DB" letter-spacing="1.3">EDITORIAL PORTFOLIO CARD</text>

  <!-- Vertical dividers -->
  <line x1="286" y1="118" x2="286" y2="326" stroke="#30363D"/>
  <line x1="760" y1="118" x2="760" y2="326" stroke="#30363D"/>

  <!-- labels -->
  <text x="318" y="140" class="mono" font-size="12" fill="#8B949E" letter-spacing="2">SELECTED INTRO</text>

  <!-- =================== SLIDE 1 =================== -->
  <g class="slide s1">
    <text x="318" y="190" class="sans" font-size="52" font-weight="800" fill="#F9FAFB" letter-spacing="-2.4">BUILDING</text>
    <text x="318" y="236" class="sans" font-size="52" font-weight="800" fill="#F9FAFB" letter-spacing="-2.4">DIGITAL</text>
    <text x="318" y="282" class="sans" font-size="52" font-weight="800" fill="#F9FAFB" letter-spacing="-2.4">SYSTEMS.</text>

    <text x="796" y="190" class="mono" font-size="12" fill="#9CA3AF" letter-spacing="1.8">01</text>
    <line x1="814" y1="186" x2="866" y2="186" stroke="#4B5563"/>
    <text x="880" y="190" class="mono" font-size="12" fill="#9CA3AF" letter-spacing="1.8">SLIDE</text>

    <text x="796" y="228" class="sans" font-size="16" fill="#D1D5DB">Clean interfaces, useful flows</text>
    <text x="796" y="252" class="sans" font-size="16" fill="#D1D5DB">and practical web experiences</text>
    <text x="796" y="276" class="sans" font-size="16" fill="#D1D5DB">made for real use, not just show.</text>
  </g>

  <!-- =================== SLIDE 2 =================== -->
  <g class="slide s2">
    <text x="318" y="190" class="sans" font-size="52" font-weight="800" fill="#F9FAFB" letter-spacing="-2.4">EDITORIAL</text>
    <text x="318" y="236" class="sans" font-size="52" font-weight="800" fill="#F9FAFB" letter-spacing="-2.4">THINKING.</text>
    <text x="318" y="282" class="sans" font-size="52" font-weight="800" fill="#F9FAFB" letter-spacing="-2.4">MODERN WEB.</text>

    <text x="796" y="190" class="mono" font-size="12" fill="#9CA3AF" letter-spacing="1.8">02</text>
    <line x1="814" y1="186" x2="866" y2="186" stroke="#4B5563"/>
    <text x="880" y="190" class="mono" font-size="12" fill="#9CA3AF" letter-spacing="1.8">SLIDE</text>

    <text x="796" y="228" class="sans" font-size="16" fill="#D1D5DB">Typography-led layouts with</text>
    <text x="796" y="252" class="sans" font-size="16" fill="#D1D5DB">clarity, structure and subtle</text>
    <text x="796" y="276" class="sans" font-size="16" fill="#D1D5DB">motion instead of clutter.</text>
  </g>

  <!-- =================== SLIDE 3 =================== -->
  <g class="slide s3">
    <text x="318" y="190" class="sans" font-size="52" font-weight="800" fill="#F9FAFB" letter-spacing="-2.4">PRACTICAL</text>
    <text x="318" y="236" class="sans" font-size="52" font-weight="800" fill="#F9FAFB" letter-spacing="-2.4">BY</text>
    <text x="318" y="282" class="sans" font-size="52" font-weight="800" fill="#F9FAFB" letter-spacing="-2.4">DEFAULT.</text>

    <text x="796" y="190" class="mono" font-size="12" fill="#9CA3AF" letter-spacing="1.8">03</text>
    <line x1="814" y1="186" x2="866" y2="186" stroke="#4B5563"/>
    <text x="880" y="190" class="mono" font-size="12" fill="#9CA3AF" letter-spacing="1.8">SLIDE</text>

    <text x="796" y="228" class="sans" font-size="16" fill="#D1D5DB">Less noise. Less fake polish.</text>
    <text x="796" y="252" class="sans" font-size="16" fill="#D1D5DB">More thoughtful work that</text>
    <text x="796" y="276" class="sans" font-size="16" fill="#D1D5DB">actually solves something.</text>
  </g>

  <!-- Bottom line and controls -->
  <line x1="318" y1="314" x2="730" y2="314" stroke="#30363D"/>

  <rect x="318" y="330" width="18" height="4" rx="2" fill="#F3F4F6" class="bar1"/>
  <rect x="344" y="330" width="18" height="4" rx="2" fill="#F3F4F6" class="bar2"/>
  <rect x="370" y="330" width="18" height="4" rx="2" fill="#F3F4F6" class="bar3"/>

  <text x="666" y="335" class="mono" font-size="10.8" fill="#9CA3AF" letter-spacing="1.5">SHORT PORTFOLIO INTRO</text>

  <rect x="950" y="312" width="108" height="2" fill="url(#blueGlow)"/>
  <text x="1080" y="334" class="mono" font-size="10" fill="#6B7280" text-anchor="end" letter-spacing="1.6">NOMANKHALIQ.DEV</text>
</svg>