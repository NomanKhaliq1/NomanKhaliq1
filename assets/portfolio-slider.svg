<svg width="1200" height="440" viewBox="0 0 1200 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="1120" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F5F5F5"/>
      <stop offset="1" stop-color="#9CA3AF"/>
    </linearGradient>

    <linearGradient id="softAccent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.28"/>
    </filter>

    <style>
      .sans { font-family: Inter, Arial, Helvetica, sans-serif; }
      .mono { font-family: "IBM Plex Mono", "Courier New", monospace; }

      .slide {
        opacity: 0;
        transform: translateY(10px);
      }

      .s1 { animation: s1 12s infinite; }
      .s2 { animation: s2 12s infinite; }
      .s3 { animation: s3 12s infinite; }

      @keyframes s1 {
        0%, 27%   { opacity: 1; transform: translateY(0); }
        32%, 100% { opacity: 0; transform: translateY(8px); }
      }

      @keyframes s2 {
        0%, 31%   { opacity: 0; transform: translateY(8px); }
        36%, 63%  { opacity: 1; transform: translateY(0); }
        68%, 100% { opacity: 0; transform: translateY(8px); }
      }

      @keyframes s3 {
        0%, 67%   { opacity: 0; transform: translateY(8px); }
        72%, 96%  { opacity: 1; transform: translateY(0); }
        100%      { opacity: 0; transform: translateY(8px); }
      }

      .bar1 { animation: bar1 12s infinite; }
      .bar2 { animation: bar2 12s infinite; }
      .bar3 { animation: bar3 12s infinite; }

      @keyframes bar1 {
        0%, 27%   { width: 72px; opacity: 1; }
        32%, 100% { width: 18px; opacity: .35; }
      }

      @keyframes bar2 {
        0%, 31%   { width: 18px; opacity: .35; }
        36%, 63%  { width: 72px; opacity: 1; }
        68%, 100% { width: 18px; opacity: .35; }
      }

      @keyframes bar3 {
        0%, 67%   { width: 18px; opacity: .35; }
        72%, 96%  { width: 72px; opacity: 1; }
        100%      { width: 18px; opacity: .35; }
      }

      .blink { animation: blink 1.3s infinite; }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: .25; }
      }

      .floatA { animation: floatA 7s ease-in-out infinite; }
      .floatB { animation: floatB 8s ease-in-out infinite; }

      @keyframes floatA {
        0%,100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      @keyframes floatB {
        0%,100% { transform: translateY(0px); }
        50% { transform: translateY(10px); }
      }
    </style>
  </defs>

  <!-- outer -->
  <rect width="1200" height="440" rx="22" fill="#0B0F14"/>
  <rect x="1" y="1" width="1198" height="438" rx="21" stroke="#30363D"/>

  <!-- main card -->
  <rect x="58" y="34" width="1084" height="372" rx="24" fill="url(#bg)" stroke="#2A313C" filter="url(#shadow)"/>

  <!-- decorative editorial blocks -->
  <rect x="58" y="34" width="84" height="372" rx="24" fill="#0A0E14"/>
  <rect x="1020" y="64" width="92" height="18" fill="#F3F4F6" opacity=".07" class="floatA"/>
  <rect x="980" y="88" width="132" height="10" fill="#A78BFA" opacity=".18" class="floatB"/>
  <rect x="912" y="348" width="200" height="14" fill="#60A5FA" opacity=".08" class="floatA"/>

  <!-- top labels -->
  <text x="110" y="78" class="mono" font-size="12" fill="#9CA3AF" letter-spacing="2.4">PROFILE / 2026</text>
  <text x="1068" y="78" class="mono" font-size="12" fill="#9CA3AF" letter-spacing="2" text-anchor="end">KARACHI · PK</text>

  <!-- left fixed block -->
  <line x1="166" y1="98" x2="166" y2="336" stroke="#30363D"/>
  <text x="110" y="146" class="sans" font-size="62" font-weight="800" fill="#F9FAFB" letter-spacing="-3">NOMAN</text>
  <text x="110" y="186" class="sans" font-size="23" font-weight="500" fill="#9CA3AF" letter-spacing="5">GHOURI</text>

  <text x="110" y="282" class="mono" font-size="12" fill="#E5E7EB" letter-spacing="2">WEB DEVELOPER</text>
  <circle cx="112" cy="308" r="4" fill="#22C55E" class="blink"/>
  <text x="126" y="312" class="mono" font-size="11" fill="#9CA3AF" letter-spacing="1.4">AVAILABLE / ONLINE</text>

  <!-- small profile card -->
  <rect x="108" y="336" width="190" height="34" rx="9" fill="#121821" stroke="#2C3440"/>
  <text x="126" y="358" class="mono" font-size="11" fill="#C7D2FE" letter-spacing="1.5">EDITORIAL PORTFOLIO CARD</text>

  <!-- center divider -->
  <line x1="360" y1="98" x2="360" y2="342" stroke="#30363D"/>

  <!-- fixed big side text -->
  <text x="398" y="126" class="mono" font-size="12" fill="#8B949E" letter-spacing="2">SELECTED INTRO</text>

  <!-- slide 1 -->
  <g class="slide s1">
    <text x="398" y="205" class="sans" font-size="64" font-weight="800" fill="#F9FAFB" letter-spacing="-3">BUILDING</text>
    <text x="398" y="258" class="sans" font-size="64" font-weight="800" fill="#F9FAFB" letter-spacing="-3">DIGITAL</text>
    <text x="398" y="311" class="sans" font-size="64" font-weight="800" fill="#F9FAFB" letter-spacing="-3">SYSTEMS.</text>

    <text x="790" y="202" class="mono" font-size="12" fill="#9CA3AF" letter-spacing="1.8">01</text>
    <line x1="810" y1="198" x2="860" y2="198" stroke="#4B5563"/>
    <text x="874" y="202" class="mono" font-size="12" fill="#9CA3AF" letter-spacing="1.8">SLIDE</text>

    <text x="790" y="246" class="sans" font-size="16" fill="#C7CDD6">Clean interfaces, useful flows,</text>
    <text x="790" y="271" class="sans" font-size="16" fill="#C7CDD6">and practical web experiences</text>
    <text x="790" y="296" class="sans" font-size="16" fill="#C7CDD6">that are made to be used.</text>
  </g>

  <!-- slide 2 -->
  <g class="slide s2">
    <text x="398" y="205" class="sans" font-size="64" font-weight="800" fill="#F9FAFB" letter-spacing="-3">EDITORIAL</text>
    <text x="398" y="258" class="sans" font-size="64" font-weight="800" fill="#F9FAFB" letter-spacing="-3">THINKING.</text>
    <text x="398" y="311" class="sans" font-size="64" font-weight="800" fill="#F9FAFB" letter-spacing="-3">MODERN WEB.</text>

    <text x="790" y="202" class="mono" font-size="12" fill="#9CA3AF" letter-spacing="1.8">02</text>
    <line x1="810" y1="198" x2="860" y2="198" stroke="#4B5563"/>
    <text x="874" y="202" class="mono" font-size="12" fill="#9CA3AF" letter-spacing="1.8">SLIDE</text>

    <text x="790" y="246" class="sans" font-size="16" fill="#C7CDD6">Typography-led layouts with</text>
    <text x="790" y="271" class="sans" font-size="16" fill="#C7CDD6">clarity, structure and subtle</text>
    <text x="790" y="296" class="sans" font-size="16" fill="#C7CDD6">motion instead of clutter.</text>
  </g>

  <!-- slide 3 -->
  <g class="slide s3">
    <text x="398" y="205" class="sans" font-size="64" font-weight="800" fill="#F9FAFB" letter-spacing="-3">PRACTICAL</text>
    <text x="398" y="258" class="sans" font-size="64" font-weight="800" fill="#F9FAFB" letter-spacing="-3">BY</text>
    <text x="398" y="311" class="sans" font-size="64" font-weight="800" fill="#F9FAFB" letter-spacing="-3">DEFAULT.</text>

    <text x="790" y="202" class="mono" font-size="12" fill="#9CA3AF" letter-spacing="1.8">03</text>
    <line x1="810" y1="198" x2="860" y2="198" stroke="#4B5563"/>
    <text x="874" y="202" class="mono" font-size="12" fill="#9CA3AF" letter-spacing="1.8">SLIDE</text>

    <text x="790" y="246" class="sans" font-size="16" fill="#C7CDD6">Less noise. Less fake polish.</text>
    <text x="790" y="271" class="sans" font-size="16" fill="#C7CDD6">More thoughtful work that</text>
    <text x="790" y="296" class="sans" font-size="16" fill="#C7CDD6">actually solves something.</text>
  </g>

  <!-- bottom nav -->
  <line x1="398" y1="352" x2="870" y2="352" stroke="#30363D"/>

  <rect x="398" y="367" width="18" height="4" rx="2" fill="#F3F4F6" class="bar1"/>
  <rect x="424" y="367" width="18" height="4" rx="2" fill="#F3F4F6" class="bar2"/>
  <rect x="450" y="367" width="18" height="4" rx="2" fill="#F3F4F6" class="bar3"/>

  <text x="760" y="372" class="mono" font-size="11" fill="#9CA3AF" letter-spacing="1.6">SHORT PORTFOLIO INTRO</text>

  <!-- subtle accent line -->
  <rect x="938" y="350" width="112" height="2" fill="url(#softAccent)"/>

  <!-- lower right signature -->
  <text x="1068" y="372" class="mono" font-size="10" fill="#6B7280" text-anchor="end" letter-spacing="1.8">NOMANKHALIQ.DEV</text>
</svg>