<svg
  width="1440"
  height="820"
  viewBox="0 0 1440 820"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Noman Ghauri — Web Developer</title>
  <desc id="desc">Animated editorial portfolio hero for Noman Ghauri.</desc>

  <defs>

    <linearGradient id="background" x1="0" y1="0" x2="1440" y2="820">
      <stop offset="0%" stop-color="#090D12"/>
      <stop offset="55%" stop-color="#0C121A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <radialGradient
      id="orb"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1190 170) rotate(125) scale(430)"
    >
      <stop offset="0%" stop-color="#4E79FF" stop-opacity=".22"/>
      <stop offset="55%" stop-color="#4E79FF" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#4E79FF" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="heroClip">
      <rect width="1440" height="820"/>
    </clipPath>

    <style>

      .sans {
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Arial,
          sans-serif;
      }

      .mono {
        font-family:
          "SFMono-Regular",
          Consolas,
          "Liberation Mono",
          monospace;
      }

      /* SLIDES */

      .slide {
        opacity: 0;
        transform: translateY(18px);
      }

      .slide-1 {
        animation: slideOne 15s ease-in-out infinite;
      }

      .slide-2 {
        animation: slideTwo 15s ease-in-out infinite;
      }

      .slide-3 {
        animation: slideThree 15s ease-in-out infinite;
      }

      @keyframes slideOne {
        0%, 28% {
          opacity: 1;
          transform: translateY(0);
        }

        33%, 95% {
          opacity: 0;
          transform: translateY(-16px);
        }

        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideTwo {
        0%, 30% {
          opacity: 0;
          transform: translateY(18px);
        }

        35%, 61% {
          opacity: 1;
          transform: translateY(0);
        }

        66%, 100% {
          opacity: 0;
          transform: translateY(-16px);
        }
      }

      @keyframes slideThree {
        0%, 63% {
          opacity: 0;
          transform: translateY(18px);
        }

        68%, 94% {
          opacity: 1;
          transform: translateY(0);
        }

        100% {
          opacity: 0;
          transform: translateY(-16px);
        }
      }

      /* INDICATORS */

      .indicator-1 {
        animation: indicatorOne 15s infinite;
      }

      .indicator-2 {
        animation: indicatorTwo 15s infinite;
      }

      .indicator-3 {
        animation: indicatorThree 15s infinite;
      }

      @keyframes indicatorOne {
        0%, 28% {
          width: 100px;
          opacity: 1;
        }

        33%, 100% {
          width: 34px;
          opacity: .25;
        }
      }

      @keyframes indicatorTwo {
        0%, 32% {
          width: 34px;
          opacity: .25;
        }

        35%, 61% {
          width: 100px;
          opacity: 1;
        }

        66%, 100% {
          width: 34px;
          opacity: .25;
        }
      }

      @keyframes indicatorThree {
        0%, 66% {
          width: 34px;
          opacity: .25;
        }

        68%, 94% {
          width: 100px;
          opacity: 1;
        }

        100% {
          width: 34px;
          opacity: .25;
        }
      }

      /* BACKGROUND MOTION */

      .float-a {
        animation: floatA 9s ease-in-out infinite;
      }

      .float-b {
        animation: floatB 11s ease-in-out infinite;
      }

      @keyframes floatA {
        0%, 100% {
          transform: translate(0px, 0px);
        }

        50% {
          transform: translate(-18px, 14px);
        }
      }

      @keyframes floatB {
        0%, 100% {
          transform: translate(0px, 0px);
        }

        50% {
          transform: translate(20px, -12px);
        }
      }

      .blink {
        animation: blink 1.5s ease-in-out infinite;
      }

      @keyframes blink {
        0%, 100% {
          opacity: 1;
        }

        50% {
          opacity: .25;
        }
      }

      /* TICKER */

      .ticker {
        animation: ticker 18s linear infinite;
      }

      @keyframes ticker {
        from {
          transform: translateX(0px);
        }

        to {
          transform: translateX(-590px);
        }
      }

    </style>
